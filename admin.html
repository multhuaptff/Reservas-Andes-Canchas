<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Andes Sport - Panel Administrativo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .tab {
            overflow: hidden;
            border-bottom: 1px solid #ccc;
            margin-bottom: 20px;
        }
        .tab button {
            background-color: inherit;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 10px 20px;
            transition: 0.3s;
            font-weight: bold;
            margin-right: 5px;
            border-radius: 30px 30px 0 0;
        }
        .tab button:hover {
            background-color: #ddd;
        }
        .tab button.active {
            background-color: #2E7D32;
            color: white;
        }
        .tabcontent {
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔧 Administración de Reservas</h1>
    <div class="tab">
        <button class="tablinks active" onclick="openTab(event, 'Horarios')">📅 Horarios</button>
        <button class="tablinks" onclick="openTab(event, 'Recurrentes')">🔄 Reservas Recurrentes</button>
    </div>

    <!-- Pestaña Horarios -->
    <div id="Horarios" class="tabcontent" style="display: block;">
        <div class="toolbar">
            <label>Fecha: <input type="date" id="fecha"></label>
            <button id="btn-anterior">←</button>
            <button id="btn-siguiente">→</button>
            <button id="btn-hoy">Hoy</button>
            <select id="granularidad">
                <option value="30">30 min</option>
                <option value="60">1 hora</option>
            </select>
        </div>
        <div id="horario-container" style="overflow-x: auto;"></div>
    </div>

    <!-- Pestaña Reservas Recurrentes -->
    <div id="Recurrentes" class="tabcontent">
        <div style="margin-bottom: 20px;">
            <button id="btn-nueva-recurrencia">➕ Nueva Recurrencia</button>
            <button id="btn-generar-ahora">🔄 Generar reservas pendientes ahora</button>
        </div>
        <div id="recurrentes-container">
            <table id="tabla-recurrentes" style="width:100%;">
                <thead>
                    <tr><th>ID</th><th>Cliente</th><th>Día</th><th>Horario</th><th>Canchas</th><th>Adelanto</th><th>Vigencia</th><th>Activo</th><th>Acciones</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal para crear/editar recurrencia -->
<div id="modal-recurrencia" class="modal">
    <div class="modal-content" style="min-width: 500px;">
        <h3 id="modal-title">Nueva Reserva Recurrente</h3>
        <label>Cliente:</label>
        <select id="recur-cliente"><option value="">(Sin cliente)</option></select><br>
        <label>Día de la semana:</label>
        <select id="recur-dia">
            <option value="0">Lunes</option><option value="1">Martes</option><option value="2">Miércoles</option>
            <option value="3">Jueves</option><option value="4">Viernes</option><option value="5">Sábado</option>
            <option value="6">Domingo</option>
        </select><br>
        <label>Hora Inicio: <input type="time" id="recur-hora-inicio" step="60"></label><br>
        <label>Hora Fin: <input type="time" id="recur-hora-fin" step="60"></label><br>
        <label>Responsable: <input type="text" id="recur-responsable"></label><br>
        <label>Canchas (Ctrl+clic para múltiples):</label>
        <select id="recur-canchas" multiple size="6"></select><br>
        <label>Adelanto semanal (S/): <input type="number" id="recur-adelanto" step="0.01" value="0"></label><br>
        <label>Vigencia desde: <input type="date" id="recur-fecha-inicio"></label><br>
        <label>Vigencia hasta (opcional): <input type="date" id="recur-fecha-fin"></label><br>
        <label><input type="checkbox" id="recur-activo" checked> Activo</label><br>
        <button id="guardar-recurrencia">Guardar</button>
        <button id="cancelar-recurrencia">Cancelar</button>
    </div>
</div>

<!-- Modal reserva normal (completo) -->
<div id="modal-reserva" class="modal">
    <div class="modal-content">
        <h3>Nueva Reserva</h3>
        <label>Fecha: <input type="date" id="fecha-reserva" readonly style="background:#e9ecef;"></label><br>

        <label>Hora Inicio:</label>
        <div style="display: flex; gap: 5px; align-items: center; margin-bottom: 10px;">
            <input type="text" id="hora-inicio" style="width: 100px; text-align: center;" readonly>
            <button type="button" id="inicio-mas30">+30</button>
            <button type="button" id="inicio-menos30">-30</button>
            <button type="button" id="inicio-am">AM</button>
            <button type="button" id="inicio-pm">PM</button>
        </div>

        <label>Hora Fin:</label>
        <div style="display: flex; gap: 5px; align-items: center; margin-bottom: 10px;">
            <input type="text" id="hora-fin" style="width: 100px; text-align: center;" readonly>
            <button type="button" id="fin-mas30">+30</button>
            <button type="button" id="fin-menos30">-30</button>
            <button type="button" id="fin-am">AM</button>
            <button type="button" id="fin-pm">PM</button>
        </div>

        <label>Responsable: <input type="text" id="responsable" required></label><br>
        <label>Teléfono (opcional): <input type="text" id="telefono"></label><br>
        <label>Cliente (opcional):
            <select id="cliente-id">
                <option value="">Sin cliente</option>
            </select>
        </label><br>
        <label>Tipo de reserva:
            <select id="tipo-reserva">
                <option value="individual">Individual (solo esta cancha)</option>
            </select>
        </label><br>
        <label>Costo estimado: <span id="costo-estimado">S/ 0.00</span></label><br>
        <label>Adelanto (S/): <input type="number" id="adelanto" step="0.01" value="0"></label><br>
        <label>Método de pago:
            <select id="metodo_pago">
                <option value="efectivo">Efectivo</option>
                <option value="yape">Yape</option>
            </select>
        </label><br>
        <label>Observaciones: <input type="text" id="observaciones"></label><br>
        <button id="guardar-reserva">Guardar</button>
        <button id="cancelar-reserva">Cancelar</button>
    </div>
</div>

<script>
    // Función para cambiar entre pestañas
    window.openTab = function(evt, tabName) {
        var i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("tabcontent");
        for (i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = "none";
        }
        tablinks = document.getElementsByClassName("tablinks");
        for (i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(" active", "");
        }
        document.getElementById(tabName).style.display = "block";
        evt.currentTarget.className += " active";
    }
</script>

<script type="module">
    import { supabase } from './supabase-client.js';
    import { initAdminView, initRecurrentesView } from './script.js';
    initAdminView(supabase);
    initRecurrentesView(supabase);
</script>
</body>
</html>
